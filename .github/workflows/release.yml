# Push a dev ágra → fejlesztői kiadás (Foglalástervező DEV frissül).
# Push a main ágra (pl. egy dev → main pull request összefésülése) → fő kiadás (mindenki frissül).
name: Kiadás

on:
  push:
    branches: [main, dev]
    # Nem készül új kiadás, ha a push csak dokumentációt, teszteket vagy a kiadási folyamatot érinti (a
    # program nem változik). Így a main a kiadási folyamat változásával is a dev-hez igazítható anélkül,
    # hogy a felhasználók új verziót kapnának. Ilyen változás kipróbálása: Actions → Kiadás → Run workflow.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'tests/**'
      - '.github/**'
      - 'tools/release/**'
  workflow_dispatch:

permissions:
  contents: write

# Csatornánként egyszerre egy kiadás; a várakozók közül csak a legújabb fut le.
concurrency:
  group: release-${{ github.ref_name == 'main' && 'stable' || 'dev' }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    uses: ./.github/workflows/build-release.yml
    with:
      channel: ${{ github.ref_name == 'main' && 'stable' || 'dev' }}
      ref: ${{ github.sha }}
    secrets: inherit
