  cancelBookings(bookingIds: [ID!]!, reasonId: ID!, comment: String, sendEmails: Boolean): String!

  """
  Create an accounting transaction for a user (e.g. record a payment from external system).
  """
  createAccountingTransaction(
    """The user to create the transaction for."""
    userId: Id!

    """
    Amount in cents. Positive = credit to user (payment received), negative = debit.
    """
    amountCents: Int!
    comment: String

    """External system reference for tracking."""
    externalReference: String

    """
    The type/category of the transaction. Must provide either a valid transactionTypeId or a freeText description.
