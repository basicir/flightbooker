    transactionType: AccountTransactionTypeDescriptionInput!

    """The date of the activity of the transaction."""
    activityDate: Date
  ): AccountingTransaction!

  """Creates a class theory booking"""
  createClassTheoryBooking(skipWarnings: Boolean, booking: ClassTheoryBookingInput!): ClassTheoryBooking!

  """Create a customer on the current account."""
  createCustomer(customer: CustomerInput!): Customer!

  """Creates an exam booking"""
  createExamBooking(skipWarnings: Boolean, booking: ExamBookingInput!): ExamBooking!

  """Creates an extra theory booking"""
  createExtraTheoryBooking(skipWarnings: Boolean, booking: ExtraTheoryBookingInput!): ExtraTheoryBooking!

  """Create a maintenance booking."""
  createMaintenanceBooking(skipWarnings: Boolean, booking: MaintenanceBookingInput!): MaintenanceBooking!

  """Create a maintenance part pending approval for an aircraft."""
  createMaintenancePart(aircraftId: Id!, maintenanceRequirementId: Id!, maintenancePart: MaintenancePartInput = {  }): MaintenancePart!

  """Create a meeting booking."""
  createMeetingBooking(skipWarnings: Boolean, booking: MeetingBookingInput!): MeetingBooking!

  """Creates a multi student booking"""
  createMultiStudentBooking(skipWarnings: Boolean, booking: MultiStudentBookingInput!): MultiStudentBooking!

